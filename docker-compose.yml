services:
  db:
    image: postgres:15-alpine
    container_name: maintenance-request-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maintenance_request
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maintenance_request"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maintenance-request-app
    ports:
      - "9001:9001"
    environment:
      APP_NAME: "maintenance-request-log"
      PORT: "9001"
      APP_SECRET: "change-me-to-a-secret-with-at-least-32-characters"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:5176"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: maintenance_request
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable
      SEED_PASSWORD: "Password123!"
      SWAGGER_HOST: "localhost:9001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
