basePath: /api
definitions:
  dto.CreateMaintenanceRequest:
    properties:
      machineId:
        maxLength: 100
        minLength: 2
        type: string
      priority:
        allOf:
        - $ref: '#/definitions/models.RequestPriority'
        enum:
        - Low
        - Medium
        - High
        - Critical
      problem:
        maxLength: 500
        minLength: 10
        type: string
    required:
    - machineId
    - priority
    - problem
    type: object
  dto.CreateUserRequest:
    properties:
      email:
        maxLength: 180
        type: string
      name:
        maxLength: 120
        minLength: 2
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      role:
        allOf:
        - $ref: '#/definitions/models.UserRole'
        enum:
        - Admin
        - Supervisor
        - Operator
      status:
        allOf:
        - $ref: '#/definitions/models.UserStatus'
        enum:
        - Active
        - Inactive
    required:
    - email
    - name
    - password
    - role
    type: object
  dto.LoginRequest:
    properties:
      email:
        maxLength: 180
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  dto.ReviewMaintenanceRequest:
    properties:
      status:
        allOf:
        - $ref: '#/definitions/models.RequestStatus'
        enum:
        - Approved
        - Rejected
    required:
    - status
    type: object
  dto.UpdateMaintenanceRequest:
    properties:
      machineId:
        maxLength: 100
        minLength: 2
        type: string
      priority:
        allOf:
        - $ref: '#/definitions/models.RequestPriority'
        enum:
        - Low
        - Medium
        - High
        - Critical
      problem:
        maxLength: 500
        minLength: 10
        type: string
      targetDate:
        type: string
      technician:
        maxLength: 180
        type: string
    required:
    - problem
    type: object
  dto.UpdateUserRequest:
    properties:
      email:
        maxLength: 180
        type: string
      name:
        maxLength: 120
        minLength: 2
        type: string
      role:
        allOf:
        - $ref: '#/definitions/models.UserRole'
        enum:
        - Admin
        - Supervisor
        - Operator
      status:
        allOf:
        - $ref: '#/definitions/models.UserStatus'
        enum:
        - Active
        - Inactive
    required:
    - email
    - name
    - role
    - status
    type: object
  models.RequestPriority:
    enum:
    - Low
    - Medium
    - High
    - Critical
    type: string
    x-enum-varnames:
    - PriorityLow
    - PriorityMedium
    - PriorityHigh
    - PriorityCritical
  models.RequestStatus:
    enum:
    - Submitted
    - Approved
    - Rejected
    type: string
    x-enum-varnames:
    - StatusSubmitted
    - StatusApproved
    - StatusRejected
  models.UserRole:
    enum:
    - Operator
    - Supervisor
    - Admin
    type: string
    x-enum-varnames:
    - RoleOperator
    - RoleSupervisor
    - RoleAdmin
  models.UserStatus:
    enum:
    - Active
    - Inactive
    type: string
    x-enum-varnames:
    - UserActive
    - UserInactive
host: localhost:8080
info:
  contact: {}
  description: API for maintenance request management.
  title: Maintenance Request Log API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid request
          schema:
            additionalProperties: true
            type: object
      summary: Login user
      tags:
      - Auth
  /auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Logout current user
      tags:
      - Auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - Auth
  /dashboard:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get dashboard summary
      tags:
      - Dashboard
  /requests:
    get:
      parameters:
      - description: Search keyword
        in: query
        name: search
        type: string
      - description: Status
        in: query
        name: status
        type: string
      - description: Priority
        in: query
        name: priority
        type: string
      - description: Page
        in: query
        name: page
        type: integer
      - description: Limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List maintenance requests
      tags:
      - Maintenance Requests
    post:
      consumes:
      - application/json
      parameters:
      - description: Request payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateMaintenanceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create maintenance request
      tags:
      - Maintenance Requests
  /requests/{id}:
    delete:
      parameters:
      - description: Request ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete maintenance request
      tags:
      - Maintenance Requests
    get:
      parameters:
      - description: Request ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get maintenance request by ID
      tags:
      - Maintenance Requests
    put:
      consumes:
      - application/json
      parameters:
      - description: Request ID
        in: path
        name: id
        required: true
        type: string
      - description: Request payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateMaintenanceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update maintenance request
      tags:
      - Maintenance Requests
  /requests/{id}/review:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Request ID
        in: path
        name: id
        required: true
        type: string
      - description: Review payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ReviewMaintenanceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Review maintenance request
      tags:
      - Maintenance Requests
  /users:
    get:
      parameters:
      - description: Search keyword
        in: query
        name: search
        type: string
      - description: Role
        in: query
        name: role
        type: string
      - description: Status
        in: query
        name: status
        type: string
      - description: Page
        in: query
        name: page
        type: integer
      - description: Limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - Users
    post:
      consumes:
      - application/json
      parameters:
      - description: User payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create user
      tags:
      - Users
  /users/{id}:
    get:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get user by ID
      tags:
      - Users
    put:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: User payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update user
      tags:
      - Users
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
